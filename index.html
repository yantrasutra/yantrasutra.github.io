<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yantrasutra</title>
  <meta name="description" content="Yantrasutra — Engineering intelligent systems, tools, and automation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1.5rem;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-symbol {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 800;
      color: #090a0f;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      text-align: center;
      padding: 3rem 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--accent);
      font-size: 0.825rem;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 1.5rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.25rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }

    .gradient-text {
      background: linear-gradient(135deg, #f8fafc 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      max-width: 640px;
      margin: 0 auto 2.5rem auto;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #f1f5f9;
      color: #090a0f;
    }

    .btn-primary:hover {
      background: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
    }

    footer {
      width: 100%;
      max-width: 900px;
      border-top: 1px solid var(--card-border);
      padding-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-symbol">Y</div>
      <span>Yantrasutra</span>
    </div>
    <nav class="nav-links">
      <a href="https://github.com/yantrasutra" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </header>

  <main>
    <div class="badge">
      <span class="badge-dot"></span>
      <span>यन्त्रसूत्र • intelligent systems</span>
    </div>

    <h1>
      <span class="gradient-text">Systems, Tools &</span><br />
      <span class="gradient-text">Autonomous Workflows.</span>
    </h1>

    <p class="subtitle">
      Building modern agentic architectures, software automation frameworks, and intelligent developer tools.
    </p>

    <div class="actions">
      <a href="https://github.com/yantrasutra" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
        Explore GitHub Organization
      </a>
      <a href="#about" class="btn btn-secondary">
        Documentation
      </a>
    </div>
  </main>

  <footer>
    <span>&copy; 2026 Yantrasutra</span>
    <div>
      <a href="https://github.com/yantrasutra" target="_blank" rel="noopener noreferrer">github.com/yantrasutra</a>
    </div>
  </footer>
</body>
</html>
